services:
  stackarr:
    build:
      context: .
    container_name: stackarr
    env_file:
      - ${STACKARR_ENV_FILE:-./deploy/unraid.env}
    environment:
      MEDIA_DOWNLOADS_ROOT: /downloads
      MEDIA_AUDIT_PATH: /config/audit.jsonl
      MEDIA_STATE_PATH: /config/state.db
    volumes:
      - ${UNRAID_DOWNLOADS_PATH:-/mnt/user/data}:/downloads:ro
      - ${UNRAID_APPDATA_PATH:-/mnt/user/appdata/stackarr}:/config
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - arr
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3);
          assert r.status == 200 and json.load(r).get('ok') is True
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  tailscale:
    image: tailscale/tailscale:stable
    container_name: stackarr-tailscale
    depends_on:
      stackarr:
        condition: service_healthy
    env_file:
      - ${TAILSCALE_ENV_FILE:-./deploy/tailscale.env}
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: stackarr
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ROUTES: ""
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    network_mode: service:stackarr
    volumes:
      - ${UNRAID_TAILSCALE_STATE_PATH:-/mnt/user/appdata/stackarr/tailscale}:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - tailscale
        - --socket=/tmp/tailscaled.sock
        - status
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

networks:
  arr:
    external: true
