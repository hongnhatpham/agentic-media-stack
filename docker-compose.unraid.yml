services:
  stackarr:
    build:
      context: .
    container_name: stackarr
    env_file:
      - ${STACKARR_ENV_FILE:-./deploy/unraid.env}
    environment:
      MEDIA_DOWNLOADS_ROOT: /downloads
      MEDIA_AUDIT_PATH: /config/audit.jsonl
      MEDIA_STATE_PATH: /config/state.db
    volumes:
      - ${UNRAID_DOWNLOADS_PATH:-/mnt/user/data}:/downloads:ro
      - ${UNRAID_APPDATA_PATH:-/mnt/user/appdata/stackarr}:/config
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - arr
      - stackarr-proxy
    ports:
      - "127.0.0.1:${STACKARR_HOST_PORT:-18080}:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          r=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3);
          assert r.status == 200 and json.load(r).get('ok') is True
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  tailscale-helper:
    image: tailscale/tailscale:stable
    container_name: stackarr-tailscale
    depends_on:
      stackarr:
        condition: service_healthy
    network_mode: host
    entrypoint:
      - /bin/sh
      - -ec
    command: >-
      tailscale --socket=/var/run/tailscale/tailscaled.sock serve --bg
      --service=svc:stackarr --https=443 127.0.0.1:${STACKARR_HOST_PORT:-18080}
      && exec sleep infinity
    volumes:
      - ${TAILSCALE_SOCKET_PATH:-/var/run/tailscale/tailscaled.sock}:/var/run/tailscale/tailscaled.sock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          tailscale --socket=/var/run/tailscale/tailscaled.sock serve status --json
          | grep -q 'stackarr'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

networks:
  arr:
    external: true
  stackarr-proxy:
    external: true
